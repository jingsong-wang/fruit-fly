name: Test and deploy Flylab

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test controller and physics
        run: npm test
      - name: Validate JavaScript
        run: |
          node --check dist/app.mjs
          node --check dist/core.mjs
          for file in dist/brain/*.mjs; do node --check "$file"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned whole-brain data and rendering assets
        run: |
          python -m pip install numpy==2.2.6 pyarrow==25.0.1
          python scripts/build-brain.py --download
      - name: Validate whole-brain feeding response
        run: |
          node scripts/benchmark-brain.mjs
          python -c "from pathlib import Path; Path('dist/brain/data/connectome.bin').unlink()"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
